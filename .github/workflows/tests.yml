name: Pruebas Selenium

on:
  push:
    branches:
      - main
      - solution
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Java 21, Chrome headless y Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CUCUMBER_PUBLISH_ENABLED: "true"
      CUCUMBER_PUBLISH_QUIET: "false"
      HEADLESS: "true"
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar y validar Gradle Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verificar secretos requeridos
        shell: bash
        run: |
          if [[ -z "$TEST_USER_EMAIL" || -z "$TEST_USER_PASSWORD" ]]; then
            echo "Faltan los secrets TEST_USER_EMAIL y/o TEST_USER_PASSWORD." >&2
            exit 1
          fi

      - name: Ejecutar la suite completa
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test --no-daemon 2>&1 | tee "$RUNNER_TEMP/cucumber-run.log"

      - name: Publicar enlace del reporte en el resumen
        if: always()
        shell: bash
        run: |
          report_url="$(grep -Eo 'https://reports\.cucumber\.io/reports/[[:alnum:]-]+' "$RUNNER_TEMP/cucumber-run.log" 2>/dev/null | tail -n 1 || true)"

          if [[ -n "$report_url" ]]; then
            {
              echo "## Reporte de Cucumber"
              echo
              echo "[Abrir el reporte publicado]($report_url)"
              echo
              echo "> Es público para quien tenga el enlace y Cucumber lo elimina automáticamente después de 24 horas."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Cucumber no devolvió una URL de reporte publicado. Revisá el log del paso de pruebas."
          fi

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 7
