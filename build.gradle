plugins {
    id 'java'
}

group = 'course.starter'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.46.0'
    testImplementation 'io.cucumber:cucumber-java:7.34.4'
    testImplementation 'io.cucumber:cucumber-testng:7.34.4'
    testImplementation 'org.testng:testng:7.12.0'
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.named('test', Test) {
    useTestNG()

    // En Linux ARM, Selenium Manager no incluye un binario compatible.
    // El Jenkins efímero instala ChromiumDriver y expone su ruta; en el
    // resto de los entornos se conserva Selenium Manager automáticamente.
    def chromeDriverPath = System.getenv('CHROMEDRIVER_PATH')
    if (chromeDriverPath) {
        systemProperty 'webdriver.chrome.driver', chromeDriverPath
    }

    // Cucumber escribe la URL del reporte publicado en la salida del test.
    // Gradle la oculta por defecto cuando la ejecución termina correctamente.
    testLogging.showStandardStreams = true

    // Cucumber expone el test mediante una clase base de TestNG. Gradle no la
    // detecta por anotaciones, por lo que delegamos el descubrimiento a TestNG.
    scanForTestClasses = false
    include '**/*Test.class'
    exclude '**/SetupCheckTest.class'

    if (project.hasProperty('cucumberTags')) {
        systemProperty 'cucumber.filter.tags', project.property('cucumberTags')
    }
}

tasks.register('setupCheck', Test) {
    group = 'verification'
    description = 'Abre Chrome para comprobar Selenium Manager de forma intencional.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useTestNG()
    scanForTestClasses = false
    include '**/SetupCheckTest.class'
}

tasks.register('doctor') {
    group = 'verification'
    description = 'Muestra información útil para diagnosticar el entorno del curso.'

    doLast {
        def currentJava = JavaVersion.current()
        def javaHome = System.getProperty('java.home')
        def configuredJavaHome = System.getenv('JAVA_HOME') ?: '(no definido)'

        println '=== Diagnóstico del entorno ==='
        println "Sistema operativo : ${System.getProperty('os.name')} ${System.getProperty('os.version')} (${System.getProperty('os.arch')})"
        println "Gradle            : ${gradle.gradleVersion}"
        println "JVM de Gradle     : ${System.getProperty('java.version')} (${System.getProperty('java.vendor')})"
        println "java.home         : ${javaHome}"
        println "JAVA_HOME         : ${configuredJavaHome}"
        println 'Java requerido    : 21 (Gradle Toolchain)'
        println "Java activo       : ${currentJava.isCompatibleWith(JavaVersion.VERSION_21) ? 'compatible' : 'NO compatible: revisá JDK 21 y JAVA_HOME'}"
        println "Chrome            : debe estar instalado; Selenium Manager resolverá ChromeDriver al ejecutar el test"
        println '==============================='
    }
}
